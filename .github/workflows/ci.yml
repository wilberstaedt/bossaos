name: CI

# Cada verificação é um passo com nome próprio, de propósito (E01, aceite 1).
# Um único `pnpm verificar` seria mais curto e diria menos: quando falhasse,
# ninguém saberia se foi o lint, os tipos, os testes ou o build sem abrir o log.
# Aqui a linha vermelha no GitHub já diz o que partiu.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Base descartável: nasce e morre com o job (E01, aceite 2).
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Valores de CI, descartáveis, sem relação com qualquer ambiente real.
      PGHOST: 127.0.0.1
      PGPASSWORD: postgres
      PGSUPERUSER: postgres
      DATABASE_URL: postgresql://bossaos_app:dev_app_local@127.0.0.1:5432/bossaos_dev
      MIGRATION_DATABASE_URL: postgresql://bossaos_migrate:dev_migrate_local@127.0.0.1:5432/bossaos_dev
      # Terceiro acesso (E04): identidade e sessão, zero dados de inquilino.
      AUTH_DATABASE_URL: postgresql://bossaos_auth:dev_auth_local@127.0.0.1:5432/bossaos_dev
      BETTER_AUTH_SECRET: segredo-de-ci-descartavel-com-32-caracteres
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CONVITE_VALIDADE_HORAS: '72'

    steps:
      - uses: actions/checkout@v4

      - name: Node fixado pelo .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: pnpm da versão declarada em packageManager
        uses: pnpm/action-setup@v4

      - name: Instalar pelo lockfile
        # `--frozen-lockfile` falha se o lockfile não corresponder ao
        # package.json. É o que transforma "instalou" em "instalou o mesmo".
        run: pnpm install --frozen-lockfile

      - name: Cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Base e papéis separados
        run: ./scripts/dev-db.sh

      - name: Migração em base descartável
        run: pnpm db:migrate:deploy

      # ── as verificações, uma a uma ────────────────────────────────────────
      # A cobertura primeiro: é a mais barata e a que invalida tudo o resto.
      # Um ID perdido significa que o mapa deixou de descrever o produto, e não
      # vale a pena saber se o que sobrou compila.
      - name: Cobertura íntegra (396 IDs)
        run: ./scripts/validar-cobertura.sh

      # Barata como a cobertura, e a que tem pior consequencia se falhar tarde:
      # um segredo que entra no historico nao sai de la apagando o ficheiro.
      - name: Nenhum segredo na árvore
        run: ./scripts/varrer-segredos.sh

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Navegador para a inspecção
        # Só o Chromium: os outros dois motores triplicariam o tempo do job para
        # responder a perguntas que o E02 não faz.
        run: pnpm exec playwright install --with-deps chromium

      # ── as provas de comportamento, que um build verde não dá ─────────────
      - name: Prova — o runtime não altera o schema
        run: ./scripts/provar-separacao-de-credenciais.sh

      - name: Prova — prontidão distingue base migrada, por migrar e em baixo
        run: ./scripts/provar-prontidao.sh

      - name: Prova — isolamento entre inquilinos
        # A mais perigosa do produto. Corre os quatro casos com o papel REAL de
        # runtime e depois DESLIGA as políticas para exigir que os casos 2 e 3
        # fiquem vermelhos: uma prova que passa com o RLS ligado e desligado não
        # está a medir o RLS. Alvo em docs/architecture/prova-de-isolamento.md,
        # escrito no E00, antes desta etapa.
        run: ./scripts/provar-isolamento.sh

      - name: Prova — acesso, convites e revogação
        # O par (1)/(2): o identificador de B com sessão de A dá ausência, o
        # MESMO identificador com sessão de B dá 200. Só o primeiro passaria num
        # sistema em que tudo devolve ausência. O controlo negativo acrescenta
        # uma política de leitura a mais e exige que o par COLAPSE — as
        # permissivas somam-se por OR, e é assim que um escopo se alarga sem
        # aparecer em teste nenhum.
        run: ./scripts/provar-acesso.sh

      - name: Prova — larguras, contraste, foco e alvos de toque
        # Aceites 1 e 2 do E02: 360/390/768/1280/1440 px, zoom, três idiomas,
        # contraste medido no DOM, armadilha de foco e regresso ao accionador.
        run: pnpm inspeccionar

      - name: Migrações aplicadas e sem desvio
        run: pnpm db:migrate:status
